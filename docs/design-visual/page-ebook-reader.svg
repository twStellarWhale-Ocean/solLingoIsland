<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, system-ui, sans-serif">
  <!-- window background (light pink theme) + 小女孩 logo 浮水印 -->
  <rect width="640" height="480" fill="#FFF0F5"/>
  <circle cx="320" cy="272" r="150" fill="#F4C2D0" opacity="0.10"/>
  <text x="320" y="292" text-anchor="middle" font-size="120" fill="#F4C2D0" opacity="0.12">&#9829;</text>

  <!-- OS title bar (標題只在 OS 標題列、內容區不重複) -->
  <rect x="0" y="0" width="640" height="26" fill="#F4C2D0" opacity="0.55"/>
  <text x="10" y="17" font-size="11" fill="#7a3b55">LingoIsland</text>
  <text x="600" y="17" font-size="12" fill="#7a3b55">&#8212; &#9633; &#10005;</text>

  <!-- main tab strip (icon over text, Segoe MDL2 style); 電子書 active -->
  <g font-size="8.5" fill="#8a5a6e" text-anchor="middle">
    <rect x="0" y="26" width="640" height="42" fill="#FFFFFF" opacity="0.45"/>
    <text x="34" y="47" font-size="11">&#9670;</text><text x="34" y="61">主題</text>
    <text x="92" y="47" font-size="11">&#9635;</text><text x="92" y="61">截圖</text>
    <text x="150" y="47" font-size="11">&#9654;</text><text x="150" y="61">影片</text>
    <rect x="180" y="28" width="66" height="38" rx="6" fill="#FFFFFF" opacity="0.92"/>
    <text x="213" y="47" font-size="11" fill="#B0578D">&#9636;</text><text x="213" y="61" fill="#B0578D" font-weight="bold">電子書</text>
    <text x="280" y="47" font-size="11">&#9633;</text><text x="280" y="61">筆記</text>
    <text x="338" y="47" font-size="11">&#8635;</text><text x="338" y="61">歷史</text>
    <text x="396" y="47" font-size="11">&#9881;</text><text x="396" y="61">選項</text>
    <text x="454" y="47" font-size="11">&#8505;</text><text x="454" y="61">關於</text>
    <text x="596" y="47" font-size="11">&#9776;</text><text x="596" y="61">字典</text>
  </g>

  <!-- sub-tabs: 獲得 / 內容 — 疊放同格、互斥切換；此圖畫【內容】為使用中（增量2 逐段閱讀器） -->
  <g font-size="11">
    <rect x="16" y="76" width="66" height="24" rx="5" fill="#FFFFFF" opacity="0.45" stroke="#F4C2D0"/>
    <text x="49" y="92" text-anchor="middle" fill="#8a5a6e">獲得</text>
    <rect x="88" y="76" width="66" height="24" rx="5" fill="#B0578D"/>
    <text x="121" y="92" text-anchor="middle" fill="#ffffff" font-weight="bold">內容</text>
    <text x="166" y="92" font-size="8.5" fill="#9a8a90">增量2＝翻開藏書逐段導讀閱讀＋TTS 朗讀＋逐字查詞加筆記＋段落說話人上色</text>
  </g>

  <!-- ============ LEFT: 章節目錄 ============ -->
  <rect x="16" y="108" width="120" height="342" rx="8" fill="#FFFFFF" opacity="0.55" stroke="#F4C2D0"/>
  <text x="26" y="127" font-size="11.5" fill="#B0578D" font-weight="bold">章節目錄</text>
  <text x="26" y="140" font-size="7.5" fill="#9a8a90">Navigation 葉章 / spine 序</text>
  <g font-size="9">
    <text x="26" y="160" fill="#6a6a6a">序 &#183; The Playgroup</text>
    <rect x="20" y="167" width="112" height="20" rx="4" fill="#F4C2D0" opacity="0.55"/>
    <text x="26" y="181" fill="#7a3b55" font-weight="bold">1. Muddy Puddles</text>
    <text x="26" y="202" fill="#6a6a6a">2. Best Friend</text>
    <text x="26" y="223" fill="#6a6a6a">3. Hide and Seek</text>
    <text x="26" y="244" fill="#6a6a6a">4. Polly Parrot</text>
    <text x="26" y="265" fill="#6a6a6a">5. Piggy in the Middle</text>
    <text x="26" y="286" fill="#6a6a6a">6. The Playground</text>
    <text x="26" y="307" fill="#6a6a6a">7. Mr Dinosaur is Lost</text>
    <text x="26" y="328" fill="#6a6a6a">8. My Cousin Chloe</text>
    <text x="26" y="349" fill="#6a6a6a">9. Gardening</text>
  </g>
  <line x1="24" y1="360" x2="128" y2="360" stroke="#F4C2D0"/>
  <text x="26" y="376" font-size="7.5" fill="#9a8a90">雙擊某章＝跳讀該章</text>
  <text x="26" y="388" font-size="7.5" fill="#9a8a90">第一段、當前章高亮</text>
  <text x="26" y="408" font-size="8" fill="#B0578D" font-weight="bold">閱讀進度：第 1 章</text>
  <text x="26" y="421" font-size="8" fill="#B0578D" font-weight="bold">第 2 段（跨啟動記憶）</text>
  <text x="26" y="440" font-size="7" fill="#9a8a90">存 EbookStore</text>

  <!-- ============ MIDDLE: 閱讀區 ============ -->
  <rect x="142" y="108" width="288" height="296" rx="8" fill="#FFFFFF" opacity="0.55" stroke="#F4C2D0"/>
  <text x="156" y="128" font-size="12.5" fill="#3a3a3a" font-weight="bold">1. Muddy Puddles</text>
  <text x="420" y="128" font-size="7.5" fill="#9a8a90" text-anchor="end">段落純文字自繪</text>
  <line x1="156" y1="134" x2="416" y2="134" stroke="#F4C2D0"/>

  <!-- 段落 1（旁白、無說話人、常態） -->
  <g font-size="9.5" fill="#5a5a5a">
    <text x="156" y="152">It is raining today. Peppa and George</text>
    <text x="156" y="166">cannot play outside in the garden.</text>
  </g>

  <!-- 當前段（放大高亮＋逐字可點＋說話人色）：Peppa 說話人 -->
  <rect x="150" y="176" width="272" height="60" rx="6" fill="#F4C2D0" opacity="0.30" stroke="#B0578D"/>
  <text x="156" y="192" font-size="8" fill="#B0578D" font-weight="bold">&#9654; 當前段（放大高亮 &#183; 逐字可點）</text>
  <g font-size="13">
    <text x="158" y="212" fill="#C2185B" font-weight="bold">Peppa:</text>
    <text x="205" y="212" fill="#2a2a2a">I</text>
    <text x="214" y="212" fill="#2a2a2a">love</text>
    <!-- 一個被點選中的字：底線＋框（示逐字可點查詞） -->
    <rect x="248" y="200" width="46" height="17" rx="3" fill="#FFFFFF" opacity="0.85" stroke="#B0578D"/>
    <text x="252" y="212" fill="#B0578D" font-weight="bold" text-decoration="underline">muddy</text>
    <text x="298" y="212" fill="#2a2a2a">puddles!</text>
    <text x="158" y="230" font-size="9" fill="#8a5a6e">點任一單字&#8594;查原文/KK/中譯並聆聽、可加入我的筆記</text>
  </g>

  <!-- 下段（Suzy 說話人色） -->
  <g font-size="10">
    <text x="158" y="256"><tspan fill="#1565C0" font-weight="bold">Suzy:</tspan><tspan fill="#5a5a5a" dx="4">Me too, Peppa! I love jumping in</tspan></text>
    <text x="158" y="270" fill="#5a5a5a">muddy puddles!</text>
  </g>
  <!-- 下段（Mummy Pig 說話人色） -->
  <g font-size="10">
    <text x="158" y="292"><tspan fill="#6A1B9A" font-weight="bold">Mummy Pig:</tspan><tspan fill="#5a5a5a" dx="4">If you jump in muddy</tspan></text>
    <text x="158" y="306" fill="#5a5a5a">puddles, you must wear your boots.</text>
  </g>
  <!-- 旁白段 -->
  <g font-size="9.5" fill="#5a5a5a">
    <text x="158" y="328">Peppa loves her red boots. She puts</text>
    <text x="158" y="342">them on and jumps up and down.</text>
  </g>
  <text x="156" y="366" font-size="7.5" fill="#9a8a90">段首 Name: 前綴&#8594;說話人（免 AI）；依使用中主題 12 色上色、無前綴段不標</text>
  <text x="156" y="382" font-size="7.5" fill="#9a8a90">EPUB 內嵌圖與複雜排版列後續增量（本增量僅段落純文字，MVP 取捨）</text>

  <!-- 控制列（上一段/下一段/繼續/朗讀/語速/主題） -->
  <rect x="142" y="410" width="288" height="38" rx="6" fill="#FFFFFF" opacity="0.62" stroke="#F4C2D0"/>
  <!-- 上一段 -->
  <rect x="148" y="416" width="46" height="26" rx="5" fill="#FFFFFF" opacity="0.9" stroke="#B0578D"/>
  <text x="171" y="433" font-size="9" fill="#B0578D" text-anchor="middle">&#9664; 上段</text>
  <!-- 繼續 -->
  <rect x="198" y="416" width="42" height="26" rx="5" fill="#B0578D"/>
  <text x="219" y="433" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">繼續</text>
  <!-- 下一段 -->
  <rect x="244" y="416" width="46" height="26" rx="5" fill="#FFFFFF" opacity="0.9" stroke="#B0578D"/>
  <text x="267" y="433" font-size="9" fill="#B0578D" text-anchor="middle">下段 &#9654;</text>
  <!-- 朗讀喇叭鈕（Segoe MDL2 喇叭字圖，離線 SAPI；唸完自動前進） -->
  <rect x="294" y="416" width="44" height="26" rx="5" fill="#FFFFFF" opacity="0.9" stroke="#B0578D"/>
  <path d="M301 425 h5 l6 -5 v14 l-6 -5 h-5 z" fill="#B0578D"/>
  <path d="M315 424 a6 6 0 0 1 0 10" fill="none" stroke="#B0578D" stroke-width="1.4"/>
  <text x="325" y="433" font-size="9" fill="#B0578D">朗讀</text>
  <!-- 語速 -->
  <rect x="342" y="416" width="44" height="26" rx="5" fill="#FFFFFF" opacity="0.85" stroke="#F4C2D0"/>
  <text x="348" y="429" font-size="7" fill="#9a8a90">語速</text>
  <text x="348" y="438" font-size="8.5" fill="#7a3b55">1.0x &#9662;</text>
  <!-- 主題 -->
  <rect x="390" y="416" width="34" height="26" rx="5" fill="#FFFFFF" opacity="0.85" stroke="#F4C2D0"/>
  <text x="396" y="429" font-size="7" fill="#9a8a90">主題</text>
  <text x="396" y="438" font-size="8.5" fill="#7a3b55">&#9662;</text>

  <!-- ============ RIGHT-TOP: 逐段清單 ============ -->
  <rect x="436" y="108" width="188" height="190" rx="8" fill="#FFFFFF" opacity="0.55" stroke="#F4C2D0"/>
  <text x="446" y="127" font-size="11" fill="#B0578D" font-weight="bold">逐段清單</text>
  <text x="446" y="139" font-size="7.5" fill="#9a8a90">可捲 &#183; 雙擊某段跳讀</text>
  <g font-size="8.5">
    <text x="446" y="156" fill="#8a8a8a">It is raining today. Peppa and&#8230;</text>
    <rect x="440" y="162" width="180" height="18" rx="3" fill="#F4C2D0" opacity="0.45"/>
    <text x="446" y="175"><tspan fill="#C2185B" font-weight="bold">Peppa:</tspan><tspan fill="#3a3a3a" dx="3">I love muddy puddles!</tspan></text>
    <text x="446" y="192"><tspan fill="#1565C0" font-weight="bold">Suzy:</tspan><tspan fill="#5a5a5a" dx="3">Me too, Peppa!&#8230;</tspan></text>
    <text x="446" y="209"><tspan fill="#6A1B9A" font-weight="bold">Mummy Pig:</tspan><tspan fill="#5a5a5a" dx="3">If you&#8230;</tspan></text>
    <text x="446" y="226" fill="#8a8a8a">Peppa loves her red boots.&#8230;</text>
    <text x="446" y="243"><tspan fill="#C2185B" font-weight="bold">Peppa:</tspan><tspan fill="#5a5a5a" dx="3">Look, George!&#8230;</tspan></text>
    <text x="446" y="260"><tspan fill="#2E7D32" font-weight="bold">George:</tspan><tspan fill="#5a5a5a" dx="3">Dine-saw! (Grr!)</tspan></text>
    <text x="446" y="277"><tspan fill="#6A1B9A" font-weight="bold">Mummy Pig:</tspan><tspan fill="#5a5a5a" dx="3">Peppa&#8230;</tspan></text>
  </g>
  <text x="446" y="292" font-size="7" fill="#9a8a90">各段依段首說話人上色（與閱讀區同源）</text>

  <!-- ============ RIGHT-BOTTOM: 說話人面板 ============ -->
  <rect x="436" y="306" width="188" height="144" rx="8" fill="#FFFFFF" opacity="0.55" stroke="#F4C2D0"/>
  <text x="446" y="325" font-size="11" fill="#B0578D" font-weight="bold">說話人面板</text>
  <text x="446" y="337" font-size="7.5" fill="#9a8a90">篩選 &#183; 於指定說話人暫停</text>
  <g font-size="9.5">
    <!-- (全部) -->
    <rect x="446" y="345" width="11" height="11" rx="2" fill="#B0578D"/>
    <text x="451" y="354" font-size="8" fill="#ffffff" text-anchor="middle">&#10003;</text>
    <text x="463" y="354" fill="#6a6a6a">（全部說話人）</text>
    <text x="614" y="354" font-size="8" fill="#9a8a90" text-anchor="end">28</text>
    <!-- Peppa -->
    <rect x="446" y="362" width="11" height="11" rx="2" fill="#FFFFFF" stroke="#B0578D"/>
    <text x="463" y="371" fill="#C2185B" font-weight="bold">Peppa</text>
    <text x="614" y="371" font-size="8" fill="#9a8a90" text-anchor="end">9</text>
    <!-- Suzy -->
    <rect x="446" y="379" width="11" height="11" rx="2" fill="#B0578D"/>
    <text x="451" y="388" font-size="8" fill="#ffffff" text-anchor="middle">&#10003;</text>
    <text x="463" y="388" fill="#1565C0" font-weight="bold">Suzy</text>
    <text x="614" y="388" font-size="8" fill="#9a8a90" text-anchor="end">6</text>
    <!-- Mummy Pig -->
    <rect x="446" y="396" width="11" height="11" rx="2" fill="#FFFFFF" stroke="#B0578D"/>
    <text x="463" y="405" fill="#6A1B9A" font-weight="bold">Mummy Pig</text>
    <text x="614" y="405" font-size="8" fill="#9a8a90" text-anchor="end">5</text>
    <!-- George -->
    <rect x="446" y="413" width="11" height="11" rx="2" fill="#FFFFFF" stroke="#B0578D"/>
    <text x="463" y="422" fill="#2E7D32" font-weight="bold">George</text>
    <text x="614" y="422" font-size="8" fill="#9a8a90" text-anchor="end">3</text>
    <!-- (無說話人) -->
    <rect x="446" y="430" width="11" height="11" rx="2" fill="#FFFFFF" stroke="#B0578D"/>
    <text x="463" y="439" fill="#8a8a8a">（無說話人 / 旁白）</text>
    <text x="614" y="439" font-size="8" fill="#9a8a90" text-anchor="end">5</text>
  </g>

  <!-- status bar -->
  <rect x="0" y="462" width="640" height="18" fill="#F4C2D0" opacity="0.5"/>
  <text x="8" y="475" font-size="8.5" fill="#7a3b55">line-stepped 逐段導讀（PauseDecider 平移、cue＝段落、無時間軸以段序前進）&#183; 唸完自動前進 &#183; 點字查詞加筆記共用既有子系統</text>
  <text x="632" y="475" font-size="8" fill="#8a5a6e" text-anchor="end">內容為示意值</text>
</svg>
