<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, system-ui, sans-serif">
  <!-- [modHmi主題管理頁]：主視窗『主題』分頁（功能列第一個分頁；#148 自原混合 Capture 頁拆出）。左主題清單｜右編輯卡片（圖片／名稱／描述／自動屏蔽字串／12 色色票）。設計期參考稿、以文字為準。 -->
  <rect width="640" height="480" fill="#FFF0F5"/>
  <text x="320" y="300" text-anchor="middle" font-size="150" fill="#F4C2D0" opacity="0.12">&#9829;</text>

  <!-- OS 標題列（標題只在 OS 標題列、內容區不重複） -->
  <rect x="0" y="0" width="640" height="26" fill="#F4C2D0"/>
  <text x="10" y="18" font-size="12" font-weight="600" fill="#5C3346">LingoIsland</text>
  <text x="600" y="18" font-size="12" fill="#5C3346">&#8211; &#9633; &#10005;</text>

  <!-- 頂部功能列分頁（圖示在上、文字在下；現行序 主題/擷取/影片/電子書/筆記/歷史/選項/關於＋右端「字典」動作鈕） -->
  <rect x="0" y="26" width="640" height="52" fill="#FBE4EC"/>
  <rect x="6" y="30" width="62" height="44" rx="9" fill="#F4C2D0"/>
  <text x="37" y="49" text-anchor="middle" font-size="15" fill="#8A5A6D">&#9639;</text>
  <text x="37" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#5C3346">主題</text>
  <g font-size="11" fill="#8A5A6D" text-anchor="middle">
    <text x="100" y="49" font-size="15">&#9635;</text><text x="100" y="66">擷取</text>
    <text x="163" y="49" font-size="15">&#9654;</text><text x="163" y="66">影片</text>
    <text x="226" y="49" font-size="15">&#9634;</text><text x="226" y="66">電子書</text>
    <text x="289" y="49" font-size="15">&#9998;</text><text x="289" y="66">筆記</text>
    <text x="352" y="49" font-size="15">&#8635;</text><text x="352" y="66">歷史</text>
    <text x="415" y="49" font-size="15">&#9881;</text><text x="415" y="66">選項</text>
    <text x="478" y="49" font-size="15">&#9432;</text><text x="478" y="66">關於</text>
  </g>
  <rect x="566" y="30" width="62" height="44" rx="9" fill="none" stroke="#F4C2D0"/>
  <text x="597" y="49" text-anchor="middle" font-size="15" fill="#8A5A6D">&#9634;</text>
  <text x="597" y="66" text-anchor="middle" font-size="11" fill="#8A5A6D">字典</text>

  <!-- 左：主題清單 -->
  <rect x="10" y="88" width="186" height="336" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#F4C2D0"/>
  <text x="20" y="108" font-size="13" font-weight="700" fill="#B0578D">主題</text>
  <rect x="106" y="94" width="82" height="20" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="147" y="108" text-anchor="middle" font-size="11" fill="#8A5A6D">＋ 新增主題</text>

  <rect x="18" y="122" width="170" height="46" rx="6" fill="#FBE4EC" stroke="#B0578D" stroke-width="2"/>
  <rect x="26" y="130" width="30" height="30" rx="4" fill="#F4C2D0"/>
  <text x="64" y="142" font-size="12" font-weight="600" fill="#5C3346">中世紀奇幻 RPG</text>
  <text x="64" y="157" font-size="10" fill="#2E7D46">使用中</text>

  <rect x="18" y="174" width="170" height="46" rx="6" fill="#FFFFFF" stroke="#E3CBD5"/>
  <rect x="26" y="182" width="30" height="30" rx="4" fill="#E1EFFB"/>
  <text x="64" y="200" font-size="12" fill="#5C3346">太空模擬</text>

  <rect x="18" y="226" width="170" height="46" rx="6" fill="#FFFFFF" stroke="#E3CBD5"/>
  <rect x="26" y="234" width="30" height="30" rx="4" fill="#E4F5E9"/>
  <text x="64" y="252" font-size="12" fill="#5C3346">影集・Friends</text>

  <text x="24" y="296" font-size="10" fill="#A9838F">右鍵選單「Delete」或 Delete 鍵刪除</text>
  <text x="24" y="312" font-size="10" fill="#A9838F">（無編輯區刪除鈕）</text>

  <!-- 分隔（GridSplitter） -->
  <rect x="198" y="88" width="4" height="336" fill="#F4C2D0" opacity="0.6"/>

  <!-- 右：編輯區內容卡片 -->
  <rect x="206" y="88" width="424" height="336" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#F4C2D0"/>

  <!-- 圖片區塊置最上 -->
  <rect x="216" y="96" width="404" height="86" rx="6" fill="#FFFFFF" stroke="#E3CBD5"/>
  <rect x="224" y="104" width="94" height="70" rx="4" fill="#FBE4EC" stroke="#F4C2D0"/>
  <polyline points="234,160 258,132 276,152 300,120 308,168" fill="none" stroke="#B0578D" stroke-width="2"/>
  <rect x="328" y="106" width="138" height="22" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="397" y="121" text-anchor="middle" font-size="11" fill="#8A5A6D">從剪貼簿貼上</text>
  <rect x="472" y="106" width="138" height="22" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="541" y="121" text-anchor="middle" font-size="11" fill="#8A5A6D">上傳檔案</text>
  <rect x="328" y="134" width="282" height="22" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="469" y="149" text-anchor="middle" font-size="11" fill="#8A5A6D">&#128269; 從圖片自動解釋</text>
  <text x="328" y="171" font-size="10" fill="#A9838F">名稱空白或仍為 New Theme 時自動填入辨識到的作品名（#53）</text>

  <!-- 名稱 -->
  <text x="216" y="199" font-size="11" font-weight="600" fill="#B0578D">名稱</text>
  <rect x="216" y="205" width="404" height="22" rx="4" fill="#FFFFFF" stroke="#E3CBD5"/>
  <text x="224" y="220" font-size="11" fill="#5C3346">中世紀奇幻 RPG</text>

  <!-- 主題描述 -->
  <text x="216" y="245" font-size="11" font-weight="600" fill="#B0578D">主題描述（作為查詢參考注入）</text>
  <rect x="216" y="251" width="404" height="44" rx="4" fill="#FFFFFF" stroke="#E3CBD5"/>
  <text x="224" y="266" font-size="11" fill="#5C3346">中世紀角色扮演遊戲畫面，含任務、裝備與魔法用語，</text>
  <text x="224" y="282" font-size="11" fill="#5C3346">翻譯宜採奇幻語感。</text>

  <!-- 自動屏蔽字串 -->
  <text x="216" y="313" font-size="11" font-weight="600" fill="#B0578D">自動屏蔽字串（匯入字幕時自動移除；以 , 分隔）</text>
  <rect x="216" y="319" width="404" height="22" rx="4" fill="#FFFFFF" stroke="#E3CBD5"/>
  <text x="224" y="334" font-size="11" fill="#5C3346">(SNORT), (LAUGHS), ♪</text>

  <!-- 12 色色票 -->
  <text x="216" y="359" font-size="11" font-weight="600" fill="#B0578D">顏色（12）— 點按色票即可更改</text>
  <g stroke="#E3CBD5">
    <rect x="216" y="365" width="26" height="20" rx="3" fill="#E8618C"/>
    <rect x="248" y="365" width="26" height="20" rx="3" fill="#2F6FED"/>
    <rect x="280" y="365" width="26" height="20" rx="3" fill="#2E7D46"/>
    <rect x="312" y="365" width="26" height="20" rx="3" fill="#C79A16"/>
    <rect x="344" y="365" width="26" height="20" rx="3" fill="#6B6B6B"/>
    <rect x="376" y="365" width="26" height="20" rx="3" fill="#8A4FCF"/>
    <rect x="408" y="365" width="26" height="20" rx="3" fill="#1B9CC4"/>
    <rect x="440" y="365" width="26" height="20" rx="3" fill="#17A184"/>
    <rect x="472" y="365" width="26" height="20" rx="3" fill="#6FA33B"/>
    <rect x="504" y="365" width="26" height="20" rx="3" fill="#D9762B"/>
    <rect x="536" y="365" width="26" height="20" rx="3" fill="#B0578D"/>
    <rect x="568" y="365" width="26" height="20" rx="3" fill="#7A5C3E"/>
  </g>
  <text x="216" y="396" font-size="9.5" fill="#A9838F">說明哪些說話人使用各顏色（例：角色名稱）。同一色雙軌——說話人字型色用原飽和色、</text>
  <text x="216" y="408" font-size="9.5" fill="#A9838F">筆記卡片底色自動調亮；留空＝未使用。</text>

  <!-- 動作鈕（釘於卡片底部右側，與左欄鈕對齊） -->
  <rect x="466" y="398" width="76" height="20" rx="5" fill="#F4C2D0"/>
  <text x="504" y="412" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5C3346">設為使用中</text>
  <rect x="550" y="398" width="60" height="20" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="580" y="412" text-anchor="middle" font-size="10.5" fill="#8A5A6D">儲存</text>

  <!-- 底部狀態列 -->
  <rect x="0" y="432" width="640" height="26" fill="#FBE4EC"/>
  <circle cx="14" cy="445" r="4" fill="#2E7D46"/>
  <text x="24" y="449" font-size="11" fill="#2E7D46">金鑰已備妥（OPENAI_API_KEY）</text>
  <text x="240" y="449" font-size="11" fill="#8A5A6D">喚起快捷鍵：Alt+L</text>
  <text x="10" y="472" font-size="10" fill="#A9838F">切至本頁預設選中「使用中」主題（非第一項）；主題為跨媒體（截圖／影片／電子書／筆記）共同歸屬單位。</text>
</svg>
