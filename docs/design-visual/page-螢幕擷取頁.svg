<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, system-ui, sans-serif">
  <!-- [modHmi螢幕擷取頁]：主視窗『擷取』分頁（#133 改名 Capture、#148 與主題管理拆為兩獨立分頁）。【內容】截圖庫（顯示中）＋【獲得】擷取管理卡片（右上以虛線框示意）。設計期參考稿、以文字為準。 -->
  <rect width="640" height="480" fill="#FFF0F5"/>
  <text x="320" y="300" text-anchor="middle" font-size="150" fill="#F4C2D0" opacity="0.12">&#9829;</text>

  <rect x="0" y="0" width="640" height="26" fill="#F4C2D0"/>
  <text x="10" y="18" font-size="12" font-weight="600" fill="#5C3346">LingoIsland</text>
  <text x="600" y="18" font-size="12" fill="#5C3346">&#8211; &#9633; &#10005;</text>

  <rect x="0" y="26" width="640" height="52" fill="#FBE4EC"/>
  <g font-size="11" fill="#8A5A6D" text-anchor="middle">
    <text x="37" y="49" font-size="15">&#9639;</text><text x="37" y="66">主題</text>
  </g>
  <rect x="69" y="30" width="62" height="44" rx="9" fill="#F4C2D0"/>
  <text x="100" y="49" text-anchor="middle" font-size="15" fill="#8A5A6D">&#9635;</text>
  <text x="100" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#5C3346">擷取</text>
  <g font-size="11" fill="#8A5A6D" text-anchor="middle">
    <text x="163" y="49" font-size="15">&#9654;</text><text x="163" y="66">影片</text>
    <text x="226" y="49" font-size="15">&#9634;</text><text x="226" y="66">電子書</text>
    <text x="289" y="49" font-size="15">&#9998;</text><text x="289" y="66">筆記</text>
    <text x="352" y="49" font-size="15">&#8635;</text><text x="352" y="66">歷史</text>
    <text x="415" y="49" font-size="15">&#9881;</text><text x="415" y="66">選項</text>
    <text x="478" y="49" font-size="15">&#9432;</text><text x="478" y="66">關於</text>
  </g>
  <rect x="566" y="30" width="62" height="44" rx="9" fill="none" stroke="#F4C2D0"/>
  <text x="597" y="49" text-anchor="middle" font-size="15" fill="#8A5A6D">&#9634;</text>
  <text x="597" y="66" text-anchor="middle" font-size="11" fill="#8A5A6D">字典</text>

  <!-- 子頁籤：內容／獲得（疊放同格、以可見性互斥切換） -->
  <rect x="10" y="86" width="62" height="24" rx="6" fill="#F4C2D0"/>
  <text x="41" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#5C3346">內容</text>
  <rect x="76" y="86" width="62" height="24" rx="6" fill="none" stroke="#F4C2D0"/>
  <text x="107" y="102" text-anchor="middle" font-size="12" fill="#8A5A6D">獲得</text>

  <!-- 【內容】＝截圖庫（左清單｜右預覽） -->
  <rect x="10" y="118" width="196" height="286" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#F4C2D0"/>
  <text x="20" y="138" font-size="13" font-weight="700" fill="#B0578D">截圖</text>
  <rect x="126" y="124" width="70" height="20" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="161" y="138" text-anchor="middle" font-size="11" fill="#8A5A6D">全部清除</text>
  <rect x="18" y="150" width="180" height="24" rx="5" fill="#FFFFFF" stroke="#E3CBD5"/>
  <rect x="24" y="155" width="14" height="14" rx="2" fill="#F4C2D0"/>
  <text x="46" y="167" font-size="11" fill="#5C3346">主題：中世紀奇幻 RPG</text>
  <text x="186" y="167" font-size="10" fill="#8A5A6D">&#9662;</text>

  <rect x="18" y="182" width="180" height="42" rx="6" fill="#FBE4EC" stroke="#B0578D" stroke-width="2"/>
  <rect x="24" y="187" width="48" height="32" rx="3" fill="#E1EFFB" stroke="#E3CBD5"/>
  <text x="80" y="200" font-size="11" font-weight="600" fill="#5C3346">2026-07-29 14:02</text>
  <text x="80" y="214" font-size="10" fill="#A9838F">中世紀奇幻 RPG</text>

  <rect x="18" y="230" width="180" height="42" rx="6" fill="#FFFFFF" stroke="#E3CBD5"/>
  <rect x="24" y="235" width="48" height="32" rx="3" fill="#E4F5E9" stroke="#E3CBD5"/>
  <text x="80" y="248" font-size="11" fill="#5C3346">2026-07-28 21:17</text>
  <text x="80" y="262" font-size="10" fill="#A9838F">（未歸屬）</text>

  <rect x="18" y="278" width="180" height="42" rx="6" fill="#FFFFFF" stroke="#E3CBD5"/>
  <rect x="24" y="283" width="48" height="32" rx="3" fill="#FBF3D9" stroke="#E3CBD5"/>
  <text x="80" y="296" font-size="11" fill="#5C3346">2026-07-28 20:41</text>
  <text x="80" y="310" font-size="10" fill="#A9838F">太空模擬</text>

  <text x="20" y="344" font-size="10" fill="#A9838F">右鍵選單「Delete」或 Delete 鍵</text>
  <text x="20" y="358" font-size="10" fill="#A9838F">刪單張（無底部刪除鈕）</text>

  <rect x="208" y="118" width="4" height="286" fill="#F4C2D0" opacity="0.6"/>

  <rect x="216" y="118" width="414" height="286" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#F4C2D0"/>
  <text x="226" y="139" font-size="11" font-weight="600" fill="#B0578D">主題：</text>
  <rect x="268" y="126" width="180" height="22" rx="4" fill="#FFFFFF" stroke="#E3CBD5"/>
  <text x="276" y="141" font-size="11" fill="#5C3346">中世紀奇幻 RPG</text>
  <text x="438" y="141" font-size="10" fill="#8A5A6D">&#9662;</text>

  <rect x="226" y="158" width="394" height="200" rx="6" fill="#FFFFFF" stroke="#E3CBD5"/>
  <rect x="256" y="180" width="334" height="156" rx="4" fill="#EEF3F8" stroke="#D6DEE6"/>
  <text x="423" y="250" text-anchor="middle" font-size="13" fill="#8DA0B0">放大預覽（選取之截圖）</text>
  <text x="423" y="270" text-anchor="middle" font-size="11" fill="#A9B8C4">尚無截圖時顯示：擷取螢幕（按鈕或快捷鍵）即可儲存於此。</text>
  <text x="226" y="376" font-size="10" fill="#A9838F">左清單右操作，同影片頁／電子書頁版面族。</text>

  <!-- 【獲得】子頁籤內容（示意，虛線框） -->
  <rect x="216" y="118" width="414" height="118" rx="8" fill="#FFF8FB" stroke="#B0578D" stroke-dasharray="5 4" opacity="0.97"/>
  <text x="228" y="138" font-size="12" font-weight="700" fill="#B0578D">【獲得】擷取管理（切換至「獲得」子頁籤時顯示）</text>
  <rect x="228" y="146" width="94" height="24" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="275" y="162" text-anchor="middle" font-size="11" fill="#8A5A6D">擷取螢幕</text>
  <text x="340" y="162" font-size="11" fill="#B0578D">快捷鍵：</text>
  <text x="392" y="162" font-size="11" font-weight="600" fill="#2E7D46">Alt+L</text>
  <rect x="440" y="146" width="56" height="24" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="468" y="162" text-anchor="middle" font-size="11" fill="#8A5A6D">變更</text>
  <text x="228" y="188" font-size="10" fill="#A9838F">擷取螢幕（按鈕或快捷鍵）；擷取的截圖會顯示於「內容」子頁籤。</text>
  <text x="228" y="204" font-size="10" fill="#A9838F">快捷鍵設定 #133 自選項頁移入，擷取設定單一落點；變更經 App 單一 config</text>
  <text x="228" y="218" font-size="10" fill="#A9838F">擁有者存檔／重註冊／resync 選項頁，避免兩頁各存 AppConfig 互相覆寫。</text>

  <rect x="0" y="412" width="640" height="26" fill="#FBE4EC"/>
  <circle cx="14" cy="425" r="4" fill="#2E7D46"/>
  <text x="24" y="429" font-size="11" fill="#2E7D46">金鑰已備妥（OPENAI_API_KEY）</text>
  <text x="240" y="429" font-size="11" fill="#8A5A6D">喚起快捷鍵：Alt+L</text>
  <text x="10" y="456" font-size="10" fill="#A9838F">手動觸發擷取重用 App.OnHotKey 動線；freeze 前先收合主視窗，凍結快照不含本程式視窗。</text>
  <text x="10" y="470" font-size="10" fill="#A9838F">兩子頁籤疊放同格、以可見性互斥切換（比照影片／電子書頁，不用 TabControl）。</text>
</svg>
