<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, system-ui, sans-serif">
  <!-- [modHmiAI動作確認頁]：AiActionWindow（Title「AI 動作」、460×360、ShowDialog、Owner＝觸發頁之視窗）。所有付費 AI 動作之單一進度與費用揭露 surface。設計期參考稿、以文字為準。 -->
  <rect width="640" height="480" fill="#FFF0F5"/>

  <!-- owner 視窗（模態期間不可操作，以淡化示意） -->
  <g opacity="0.35">
    <rect x="0" y="0" width="640" height="26" fill="#F4C2D0"/>
    <text x="10" y="18" font-size="12" font-weight="600" fill="#5C3346">LingoIsland — 影片擷取</text>
    <rect x="0" y="26" width="640" height="52" fill="#FBE4EC"/>
    <text x="20" y="58" font-size="12" fill="#8A5A6D">主題　擷取　影片　電子書　筆記　歷史　選項　關於</text>
    <rect x="10" y="88" width="180" height="336" rx="8" fill="#FFFFFF" stroke="#F4C2D0"/>
    <text x="22" y="110" font-size="12" fill="#8A5A6D">影片清單</text>
    <rect x="200" y="88" width="430" height="336" rx="8" fill="#FFFFFF" stroke="#F4C2D0"/>
    <text x="212" y="110" font-size="12" fill="#8A5A6D">【獲得】／【內容】</text>
    <rect x="0" y="432" width="640" height="26" fill="#FBE4EC"/>
  </g>
  <rect x="0" y="0" width="640" height="480" fill="#000000" opacity="0.10"/>

  <!-- 模態對話視窗（CenterOwner） -->
  <rect x="90" y="60" width="460" height="360" rx="6" fill="#FFF0F5" stroke="#B0578D" stroke-width="1.5"/>
  <rect x="90" y="60" width="460" height="26" rx="6" fill="#F4C2D0"/>
  <rect x="90" y="76" width="460" height="10" fill="#F4C2D0"/>
  <text x="102" y="78" font-size="12" font-weight="600" fill="#5C3346">AI 動作</text>
  <text x="528" y="78" font-size="12" fill="#5C3346">&#10005;</text>

  <!-- HeaderText -->
  <text x="106" y="112" font-size="13" font-weight="700" fill="#B0578D">正在將 42 句台詞加入「影片-Rachel」</text>

  <!-- MsgText（可捲、追加即捲到底） -->
  <rect x="106" y="124" width="428" height="176" rx="5" fill="#FFFFFF" stroke="#E3CBD5"/>
  <g font-size="11.5" fill="#3A2C33">
    <text x="116" y="143">已取得字幕 42 句，開始逐句翻譯…</text>
    <text x="116" y="161">(1/42) “Could I BE any more sarcastic?”</text>
    <text x="116" y="179">(2/42) “We were on a break!”</text>
    <text x="116" y="197">(3/42) “Pivot! PIVOT!”</text>
    <text x="116" y="215">…</text>
    <text x="116" y="233">(41/42) “How you doin’?”</text>
    <text x="116" y="251">(42/42) 完成，已去重加入 38 則（4 則已在筆記中）。</text>
  </g>
  <rect x="527" y="130" width="4" height="60" rx="2" fill="#F4C2D0"/>

  <!-- CostText：估算費用 -->
  <rect x="106" y="308" width="428" height="58" rx="5" fill="#FDF5F8" stroke="#F4C2D0"/>
  <text x="116" y="326" font-size="12" fill="#B0578D">Tokens：18,420 輸入 + 3,106 輸出，共 42 次呼叫。</text>
  <text x="116" y="343" font-size="12" font-weight="700" fill="#B0578D">估算 AI 費用 ≈ 約 NT$2.41</text>
  <text x="116" y="359" font-size="10" fill="#A9838F">（估算，匯率約 US$1≈NT$32；實際請以 OpenAI 現價與匯率為準）</text>

  <!-- 單一動作鈕：進行中＝取消／結束後＝確定 -->
  <rect x="428" y="378" width="106" height="28" rx="5" fill="none" stroke="#F4C2D0"/>
  <text x="481" y="397" text-anchor="middle" font-size="12" fill="#8A5A6D">取消</text>
  <text x="106" y="397" font-size="10" fill="#A9838F">進行中＝「取消」／結束後＝「確定」（單一鈕、不並列兩鈕）</text>

  <text x="90" y="444" font-size="10.5" fill="#8A5A6D">三處觸發：以 AI 抽取字幕／批次加入影片／說話人整批台詞加入筆記。</text>
  <text x="90" y="460" font-size="10.5" fill="#8A5A6D">invariant：按「取消」或標題列 ✕ 皆真取消（CancellationTokenSource.Cancel），背景管線不得續跑續花費。</text>
  <text x="90" y="474" font-size="10.5" fill="#8A5A6D">免費動作以 showCost:false 隱藏費用列、autoCloseOnSuccess:true 成功即自動關。</text>
</svg>
